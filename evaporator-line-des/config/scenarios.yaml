# =============================================================================
# Improvement scenarios for the Company's evaporator line (illustrative data)
# =============================================================================
# Each scenario = overrides on line_parameters.yaml (same nested structure).
# Values may be literals or operators {scale: x} / {add: x}. `extends` applies
# other scenarios first. Every scenario is evaluated at each demand level in
# demand.scenario_eva_per_week with common random numbers (same seeds), and
# compared with S0 at the same demand (paired differences, 95 % CI).
# =============================================================================

scenarios:
  S0:
    name: "Baseline"
    description: "Current state: 2-person steeking crew, 1 header welder, push release, transfer batch 3."
    overrides: {}

  S1:
    name: "3rd steeking operator"
    description: "Steeking crew 2 -> 3 (eta 0.85): elapsed 420 -> 329 min/EVA."
    overrides:
      resources:
        steeking_crew: {crew: 3}

  S2:
    name: "Steeking standard work / fixtures"
    description: "Standard work and lacing fixtures cut steeking time by 20% (420 -> 336 min/EVA)."
    overrides:
      operations:
        steeking: {mean_min: {scale: 0.80}}

  S3:
    name: "2nd header-welding station"
    description: "A second header-welding station and welder (2 parallel servers)."
    overrides:
      resources:
        header_welder: {servers: 2}

  S4:
    name: "Fin press OEE 70% -> 85%"
    description: "SMED (setup -40%) plus TPM and quality package: MTBF 540, MTTR 10, P 0.985, Q 0.99, 2-min reel change (OEE 85.0%)."
    overrides:
      fin_press: {setup_min: 18, mtbf_min: 540, mttr_min: 10, performance: 0.985, quality: 0.99, reload_min: 2}

  S5:
    name: "One-piece flow (transfer batch 1)"
    description: "EVA move individually between stations (process lot stays 3)."
    overrides:
      orders: {transfer_batch: 1}

  S6:
    name: "Combined: S1 + S3 + CONWIP"
    description: "3rd steeker, 2nd header welder and CONWIP release of the coil line (limit 3 work orders)."
    extends: [S1, S3]
    overrides:
      release: {rule: conwip, conwip_limit_orders: 3}

  S7:
    name: "Recommended: S6 + one-piece flow"
    description: "Extension beyond the brief: S6 capacity package plus transfer batch 1 (S5)."
    extends: [S6, S5]
    overrides: {}
