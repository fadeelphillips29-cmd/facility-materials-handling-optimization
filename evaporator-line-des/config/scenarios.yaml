# =============================================================================
# Improvement scenarios (ALL DATA FICTIONAL)
# =============================================================================
# Each scenario is a set of overrides applied on top of line_parameters.yaml.
#
#   extends:   list of scenario ids whose overrides are applied first (in order)
#   overrides: nested mapping mirroring line_parameters.yaml
#     - top-level scalars/maps (demand, orders, release, simulation, ...) are
#       merged key by key
#     - buffers: {all: N} sets every buffer; {capacities: [...]} sets each one
#     - stations: keys are a station id (4), an id range ("1-5") or "all";
#       values map field -> new value. A value may be a literal or an operator:
#         {scale: 0.6}  multiply the current value
#         {add: 2}      add to the current value
# All scenarios share the base seed, so replication r of every scenario uses
# the same random-number streams (common random numbers).
# =============================================================================

scenarios:
  S0:
    name: "Baseline"
    description: "Current state as described in line_parameters.yaml."
    overrides: {}

  S1:
    name: "Larger buffers"
    description: "All inter-station buffers increased from 5 to 10 units."
    overrides:
      buffers: {all: 10}

  S2:
    name: "SMED"
    description: "Changeover times reduced by 40% at Fin-Pack (St 2) and Header Brazing (St 4)."
    overrides:
      stations:
        2: {changeover_min: {scale: 0.60}}
        4: {changeover_min: {scale: 0.60}}

  S3:
    name: "Second brazing fixture"
    description: "Header Brazing (St 4) capacity increased to 2 parallel fixtures."
    overrides:
      stations:
        4: {servers: 2}

  S4:
    name: "Preventive maintenance"
    description: "TPM programme: MTBF +25% and MTTR -15% at stations 1-5."
    overrides:
      stations:
        "1-5": {mtbf_min: {scale: 1.25}, mttr_min: {scale: 0.85}}

  S5:
    name: "Combined (SMED + PM + buffers 8)"
    description: "S2 and S4 together, with all buffers set to 8 units."
    extends: [S2, S4]
    overrides:
      buffers: {all: 8}

  S6:
    name: "Combined + second fixture (extension)"
    description: "S5 plus a second brazing fixture (S3). Added beyond the brief to test whether takt is reachable."
    extends: [S5, S3]
    overrides: {}
