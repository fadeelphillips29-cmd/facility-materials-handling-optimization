[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evapsim"
version = "2.0.0"
description = "DES and Monte Carlo analysis of an evaporator production system (VSM-based, illustrative data)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["simpy>=4.1,<5", "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "PyYAML>=6.0"]

[project.scripts]
evapsim = "evapsim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "SIM300"]
